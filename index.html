<!DOCTYPE html>
<html>
<head>
  <title>Weather App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="wa.css">
  <link id="weatherTheme" rel="stylesheet" href="">
</head>

<body>

<div class="scene">
    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <div class="rain">
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
        <div class="drop"></div>
    </div>

    <div class="ground"></div>
</div>

<div class="container">

    <h2>Weather Info 🌦️</h2>

    
    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <div id="suggestions"></div>
    </div>

    <button id="searchBtn">Search</button>

    <div class="weather-card">
        <div class="temp" id="result"></div>
        <img id="icon">
        <div class="weather-type"></div>
        <div class="city"></div>
    </div>

</div>

<script src="wa.js"></script>

</body>
</html>
